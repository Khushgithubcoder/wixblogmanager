<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Blog Post</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="connect-wix.html">Connect Wix</a>
    <a href="wix-posts.html">Wix Blog Manager</a>
    <a class="active" href="create-blog.html">Create Post</a>
    <a href="import-sheets.html">Import Sheets</a>
    <a href="history.html">History & Queue</a>
    <button class="logout" type="button" onclick="logout()">Log out</button>
  </nav>

  <p class="eyebrow">Content Authoring</p>
  <h1>Create & Publish Blog Post</h1>
  <p class="lede">Write content, add featured imagery, and publish directly to the connected Wix site or schedule for future automated release.</p>

  <div class="card">
    <label for="title">Post Title</label>
    <input id="title" placeholder="e.g. 10 Essential Strategies for Modern E-Commerce Growth" />

    <label for="content">Article Body Content</label>
    <textarea id="content" rows="10" placeholder="Write or paste your article content here..."></textarea>

    <label for="imageUrl">Featured Cover Image URL <span class="muted">(Optional — imported automatically to Wix Media Manager)</span></label>
    <input id="imageUrl" placeholder="https://images.unsplash.com/..." oninput="previewImage()" />
    <div id="image-preview" style="display:none; margin-bottom:18px;">
      <img id="preview-img" src="" alt="Cover preview" style="max-height:180px; border-radius:8px; border:1px solid #d4d8d1;" />
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
      <button onclick="publishToWixNow()">Publish Directly to Wix</button>
      <button class="btn btn-secondary" onclick="createWixDraft()">Save as Wix Draft</button>
      <button class="btn btn-secondary" onclick="saveLocalDraft()">Save Local Draft</button>
    </div>

    <!-- Scheduling section -->
    <div style="margin-top:24px; padding-top:18px; border-top:1px solid var(--line);">
      <label for="scheduledFor">Or Schedule for Future Automated Publishing:</label>
      <div style="display:flex; gap:10px; max-width:400px;">
        <input id="scheduledFor" type="datetime-local" style="margin-bottom:0;" />
        <button class="btn btn-secondary" onclick="schedulePost()">Schedule</button>
      </div>
    </div>

    <div id="result" style="margin-top:18px;"></div>
  </div>

  <script>
    async function checkAuth() {
      const res = await fetch("/api/auth/me");
      if (!res.ok) window.location.href = "login.html";
    }

    function previewImage() {
      const url = document.getElementById("imageUrl").value.trim();
      const previewArea = document.getElementById("image-preview");
      const img = document.getElementById("preview-img");
      if (url.startsWith("http")) {
        img.src = url;
        previewArea.style.display = "block";
      } else {
        previewArea.style.display = "none";
      }
    }

    function getFormData() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const imageUrl = document.getElementById("imageUrl").value.trim() || null;
      if (!title || !content) {
        alert("Please provide both a title and article body content.");
        return null;
      }
      return { title, content, imageUrl };
    }

    async function publishToWixNow() {
      const data = getFormData();
      if (!data) return;

      const result = document.getElementById("result");
      result.innerHTML = `<span class="hint">Uploading media and publishing post to Wix website...</span>`;

      try {
        const res = await fetch("/api/wix/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...data, publishNow: true }),
        });
        const resData = await res.json();
        if (res.ok) {
          result.innerHTML = `
            <div style="background:#dff4eb; padding:14px; border-radius:6px; border:1px solid #bce6d5;">
              <strong class="text-success">🎉 Post published live on Wix!</strong>
              <p style="margin:6px 0 0; font-size:13px;">Wix Post ID: <code>${resData.postId}</code></p>
              <a href="wix-posts.html" class="btn btn-sm" style="margin-top:8px;">View in Wix Blog Manager ↗</a>
            </div>
          `;
        } else {
          result.innerHTML = `<div class="text-error">Error publishing to Wix: ${resData.error}</div>`;
        }
      } catch (err) {
        result.innerHTML = `<div class="text-error">Network error: ${err.message}</div>`;
      }
    }

    async function createWixDraft() {
      const data = getFormData();
      if (!data) return;

      const result = document.getElementById("result");
      result.innerHTML = `<span class="hint">Creating draft on Wix...</span>`;

      try {
        const res = await fetch("/api/wix/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...data, publishNow: false }),
        });
        const resData = await res.json();
        if (res.ok) {
          result.innerHTML = `
            <div style="background:#fdf3d8; padding:14px; border-radius:6px; border:1px solid #f6e2a8;">
              <strong>📝 Created draft on Wix!</strong>
              <p style="margin:6px 0 0; font-size:13px;">Wix Draft ID: <code>${resData.draftId}</code></p>
              <a href="wix-posts.html" class="btn btn-sm" style="margin-top:8px;">Review Drafts ↗</a>
            </div>
          `;
        } else {
          result.innerHTML = `<div class="text-error">Error: ${resData.error}</div>`;
        }
      } catch (err) {
        result.innerHTML = `<div class="text-error">Network error: ${err.message}</div>`;
      }
    }

    async function saveLocalDraft() {
      const data = getFormData();
      if (!data) return;

      const res = await fetch("/api/blogs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const resData = await res.json();
      if (res.ok) {
        document.getElementById("result").innerHTML = `<span class="text-success">Saved as local draft. View in History & Queue.</span>`;
      } else {
        document.getElementById("result").innerHTML = `<span class="text-error">${resData.error}</span>`;
      }
    }

    async function schedulePost() {
      const scheduledFor = document.getElementById("scheduledFor").value;
      if (!scheduledFor) {
        alert("Please pick a scheduled date and time.");
        return;
      }
      const data = getFormData();
      if (!data) return;

      // 1. Save local draft
      const saveRes = await fetch("/api/blogs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const saved = await saveRes.json();
      if (!saveRes.ok) return alert(saved.error);

      // 2. Schedule it
      const schedRes = await fetch(`/api/blogs/${saved.id}/schedule`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scheduledFor }),
      });
      const schedData = await schedRes.json();
      if (schedRes.ok) {
        document.getElementById("result").innerHTML = `
          <div style="background:#fdf3d8; padding:14px; border-radius:6px; border:1px solid #f6e2a8;">
            <strong>⏰ Scheduled for ${scheduledFor}!</strong>
            <p class="hint" style="margin:4px 0 0;">The background scheduler will automatically publish this to the client's Wix site at the scheduled time.</p>
          </div>
        `;
      } else {
        document.getElementById("result").innerHTML = `<span class="text-error">${schedData.error}</span>`;
      }
    }

    checkAuth();
  </script>
  <script src="app.js"></script>
</body>
</html>
