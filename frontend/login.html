<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <p class="eyebrow">Wix blog automation</p>
  <h1>Login</h1>
  <p class="lede">A focused workspace for turning your content into published Wix posts.</p>
  <div class="card">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Your password" />
    <div id="invite-row" style="display:none;">
      <label for="inviteCode">Invite code <span class="muted">(only needed to create an account)</span></label>
      <input id="inviteCode" type="password" autocomplete="off" placeholder="Invite code" />
    </div>
    <button onclick="login()">Login</button>
    <button id="signup-btn" style="display:none;" onclick="signup()">Sign up instead</button>
    <p id="msg" class="error"></p>
  </div>

  <script>
    async function submitAuth(path) {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const inviteCode = document.getElementById("inviteCode").value;
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, inviteCode }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("msg").textContent = data.error;
        return;
      }
      window.location.href = "dashboard.html";
    }
    function login() { submitAuth("/api/auth/login"); }
    function signup() { submitAuth("/api/auth/signup"); }

    // Sign-ups are invite-only; only show the option when the server has it enabled.
    fetch("/api/auth/config").then((r) => r.json()).then((cfg) => {
      if (cfg.signupEnabled) {
        document.getElementById("invite-row").style.display = "block";
        document.getElementById("signup-btn").style.display = "inline-block";
      }
    }).catch(() => {});
  </script>
</body>
</html>
